name: Prolate item 6 center-cap certificate

on:
  workflow_dispatch:

concurrency:
  group: prolate-item6-center-cap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  center-cap-block:
    name: center-cap-${{ matrix.lo }}-${{ matrix.hi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lo: 1
            hi: 2
          - lo: 2
            hi: 3
          - lo: 3
            hi: 4
          - lo: 4
            hi: 5
          - lo: 5
            hi: 6
          - lo: 6
            hi: 7
          - lo: 7
            hi: 8
          - lo: 8
            hi: 9
          - lo: 9
            hi: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validated arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Certify exact lambda block
        working-directory: CERTIFICATES/prolate/item6_axis
        run: >-
          python prolate_axis_center_cap_block_arb.py
          --dps 50
          --tolerance 1e-18
          --integration-depth 22
          --eval-limit 200000
          --max-split-depth 14
          --max-boxes 16384
          --w-num 1
          --w-den 20
          --lambda-lo ${{ matrix.lo }}
          --lambda-hi ${{ matrix.hi }}
          --json prolate_axis_center_cap_block_${{ matrix.lo }}_${{ matrix.hi }}.json
      - name: Upload block certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-center-cap-block-${{ matrix.lo }}-${{ matrix.hi }}
          path: |
            CERTIFICATES/prolate/item6_axis/prolate_axis_center_cap_block_${{ matrix.lo }}_${{ matrix.hi }}.json
            CERTIFICATES/prolate/item6_axis/prolate_axis_center_cap_block_${{ matrix.lo }}_${{ matrix.hi }}.json.sha256

  combine:
    name: center-cap-combine-1-10
    needs: center-cap-block
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download all block certificates
        uses: actions/download-artifact@v4
        with:
          pattern: prolate-item6-center-cap-block-*
          path: CERTIFICATES/prolate/item6_axis/block_outputs
          merge-multiple: true
      - name: Combine exact adjacent blocks
        working-directory: CERTIFICATES/prolate/item6_axis
        run: >-
          python prolate_axis_center_cap_combine.py
          --pattern "block_outputs/prolate_axis_center_cap_block_*.json"
          --json prolate_axis_center_cap_combined_1_10.json
      - name: Upload combined certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-center-cap-combined-1-10
          path: |
            CERTIFICATES/prolate/item6_axis/prolate_axis_center_cap_combined_1_10.json
            CERTIFICATES/prolate/item6_axis/prolate_axis_center_cap_combined_1_10.json.sha256
