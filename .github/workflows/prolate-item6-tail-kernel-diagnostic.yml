name: Prolate item 6 tail H kernel diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/prolate-item6-tail-kernel-diagnostic.yml"
      - "CERTIFICATES/prolate/item6_axis/prolate_axis_tail_H_kernel_diagnostic_arb.py"
      - "CERTIFICATES/prolate/item6_axis/prolate_axis_tail_H_block_arb.py"
  workflow_dispatch:

concurrency:
  group: prolate-item6-tail-kernel-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validated arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Compile diagnostic
        working-directory: CERTIFICATES/prolate/item6_axis
        run: python -m py_compile prolate_axis_tail_H_kernel_diagnostic_arb.py
      - name: Run stage-by-stage diagnostic
        working-directory: CERTIFICATES/prolate/item6_axis
        run: python prolate_axis_tail_H_kernel_diagnostic_arb.py
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-tail-H-kernel-diagnostic
          path: CERTIFICATES/prolate/item6_axis/prolate_axis_tail_H_kernel_diagnostic.json
          if-no-files-found: error
