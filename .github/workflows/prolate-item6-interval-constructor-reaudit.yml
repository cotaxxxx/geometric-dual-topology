name: Prolate item 6 interval-constructor re-audit

on:
  pull_request:
    paths:
      - "CERTIFICATES/prolate/item6_axis/prolate_axis_interval_constructor_audit.py"
      - "CERTIFICATES/prolate/item6_axis/INTERVAL_CONSTRUCTOR_REAUDIT_2026-08-08.md"
      - ".github/workflows/prolate-item6-interval-constructor-reaudit.yml"
  push:
    branches:
      - agent/prolate-item6-axis
    paths:
      - "CERTIFICATES/prolate/item6_axis/prolate_axis_interval_constructor_audit.py"
      - "CERTIFICATES/prolate/item6_axis/INTERVAL_CONSTRUCTOR_REAUDIT_2026-08-08.md"
      - ".github/workflows/prolate-item6-interval-constructor-reaudit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prolate-item6-interval-constructor-reaudit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned interval runtime
        run: python -m pip install python-flint==0.9.0
      - name: Run strengthened containment audit
        working-directory: CERTIFICATES/prolate/item6_axis
        run: python prolate_axis_interval_constructor_audit.py
      - name: Upload re-audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prolate-item6-interval-constructor-reaudit
          path: |
            CERTIFICATES/prolate/item6_axis/prolate_axis_interval_constructor_audit.py
            CERTIFICATES/prolate/item6_axis/prolate_axis_interval_constructor_audit.json
